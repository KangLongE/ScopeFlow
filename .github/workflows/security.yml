name: Credential protection
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified from the official tag
        with:
          persist-credentials: false
      - run: node --test scripts/check-secrets.test.mjs
      - run: node scripts/check-secrets.mjs
